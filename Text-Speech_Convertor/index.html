<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered Text to Speech Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h4><center>Developed by Ravi Singh</center></h4>
  
  <div class="hero">
    <h1>Text To Speech <span>Converter</span></h1>
    
    <!-- Textarea for input -->
    <textarea aria-label="Enter text to convert into speech" placeholder="Write or dictate anything here..."></textarea>
    
    <!-- Controls row -->
    <div class="row">
      <select aria-label="Select voice"></select>
      <button id="playBtn" aria-label="Play the entered text"><img src="play.png" alt="">Listen</button>
      <button id="stopBtn" aria-label="Stop speaking"><img src="stop.png" alt="">Stop</button>
      <button id="micBtn" aria-label="Use microphone to dictate"><img src="mic.png" alt="">Speak</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
